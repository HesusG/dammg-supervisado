<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Las vecinas votan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #fdfdfd; --papel2: #f2f2f2; --tinta: #1a1a1a; --tinta2: #575757;
  --w: #0847c4; --error: #fb2c36; --amarillo: #ffcd42; --verde: #2e7d5b; --naranja: #f27900; --nota: #fff3c4;
  --borde: 2.5px solid var(--tinta); --sombra: 5px 5px 0 var(--tinta);
  --display: 'Oswald', 'Arial Narrow', sans-serif; --texto: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--papel); color: var(--tinta); font-family: var(--texto); }
.marco { min-height: 100vh; display: grid; grid-template-columns: 40fr 60fr; gap: 22px; padding: 18px 22px; }
h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(1.3rem, 2.4vw, 2.1rem); line-height: 1.05;
  display: inline-block; margin: 0 0 10px; padding: 6px 14px; border: var(--borde); box-shadow: var(--sombra); }
.izq { font-size: clamp(0.95rem, 1.3vw, 1.2rem); line-height: 1.3; display: flex; flex-direction: column; gap: 7px; }
.palabras { background: var(--nota); border: 1.25px solid var(--tinta); padding: 6px 10px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 0.9rem var(--texto); padding: 6px 10px; border: var(--borde); background: var(--papel); cursor: pointer; box-shadow: 3px 3px 0 var(--tinta); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
label.casilla { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; }
label.casilla input { width: 1.2em; height: 1.2em; accent-color: var(--tinta); }
.panel { border: var(--borde); box-shadow: var(--sombra); position: relative; background: #fff; }
.panel svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.mono { font-family: var(--mono); }
input[type=range] { width: 100%; accent-color: var(--w); margin: 2px 0 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
td { padding: 1px 6px; border-bottom: 1.25px solid #ddd; vertical-align: middle; }
td.n { font-family: var(--mono); font-weight: 700; text-align: right; width: 2.5em; }
.muestra { display: inline-block; width: 0.8em; height: 0.8em; border: 1.5px solid var(--tinta); border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.cuadros { display: flex; flex-wrap: wrap; gap: 2px; }
.cuadros i { display: block; width: 11px; height: 14px; border: 1px solid var(--tinta); }
.pred { border: var(--borde); box-shadow: var(--sombra); padding: 6px 12px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grande { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 2.5rem); font-weight: 700; text-transform: uppercase; line-height: 1; }
.nota { font-size: 0.85em; color: var(--tinta2); }
@media (max-width: 820px) { .marco { grid-template-columns: 1fr; } .panel { height: 380px; } }
</style>
</head>
<body>
<div class="marco">
  <section class="izq">
    <div><h1>Las vecinas votan</h1></div>
    <div class="palabras">Cada punto es una flor de iris, pintada por su especie. La <b>estrella</b> es una flor nueva: arrástrala. Sus <b>k vecinas</b> más cercanas votan y gana la especie con más votos.</div>
    <div class="dos">
      <div><span class="mono">largo = <strong id="tl"></strong> cm</span><input type="range" id="largo" min="1" max="7" step="0.1"></div>
      <div><span class="mono">ancho = <strong id="ta"></strong> cm</span><input type="range" id="ancho" min="0.1" max="2.6" step="0.1"></div>
    </div>
    <div><span class="mono">k (cuántas vecinas votan) = <strong id="tk"></strong></span><input type="range" id="k" min="1" max="25" step="1"></div>
    <div class="botones">
      <button id="facil">Flor fácil (4.0, 1.3)</button><button id="dificil">Flor difícil (5.0, 1.6)</button>
    </div>
    <div>
      <label class="casilla"><input type="checkbox" id="fondo"> Colorear el fondo por lo que predice</label>
    </div>
    <table id="votos"></table>
    <div class="pred"><span>Predice:</span><span class="grande" id="pred"></span></div>
    <div class="nota" id="empate"></div>
  </section>
  <section class="panel"><svg id="g" viewBox="0 0 760 540" preserveAspectRatio="xMidYMid meet"></svg></section>
</div>
<script>
// iris de Fisher (load_iris de scikit-learn): largo y ancho del pétalo en cm y especie (0, 1, 2), en el orden original
const CRUDO = '1.4,0.2,0;1.4,0.2,0;1.3,0.2,0;1.5,0.2,0;1.4,0.2,0;1.7,0.4,0;1.4,0.3,0;1.5,0.2,0;1.4,0.2,0;1.5,0.1,0;1.5,0.2,0;1.6,0.2,0;1.4,0.1,0;1.1,0.1,0;1.2,0.2,0;1.5,0.4,0;1.3,0.4,0;1.4,0.3,0;1.7,0.3,0;1.5,0.3,0;1.7,0.2,0;1.5,0.4,0;1.0,0.2,0;1.7,0.5,0;1.9,0.2,0;1.6,0.2,0;1.6,0.4,0;1.5,0.2,0;1.4,0.2,0;1.6,0.2,0;1.6,0.2,0;1.5,0.4,0;1.5,0.1,0;1.4,0.2,0;1.5,0.2,0;1.2,0.2,0;1.3,0.2,0;1.4,0.1,0;1.3,0.2,0;1.5,0.2,0;1.3,0.3,0;1.3,0.3,0;1.3,0.2,0;1.6,0.6,0;1.9,0.4,0;1.4,0.3,0;1.6,0.2,0;1.4,0.2,0;1.5,0.2,0;1.4,0.2,0;4.7,1.4,1;4.5,1.5,1;4.9,1.5,1;4.0,1.3,1;4.6,1.5,1;4.5,1.3,1;4.7,1.6,1;3.3,1.0,1;4.6,1.3,1;3.9,1.4,1;3.5,1.0,1;4.2,1.5,1;4.0,1.0,1;4.7,1.4,1;3.6,1.3,1;4.4,1.4,1;4.5,1.5,1;4.1,1.0,1;4.5,1.5,1;3.9,1.1,1;4.8,1.8,1;4.0,1.3,1;4.9,1.5,1;4.7,1.2,1;4.3,1.3,1;4.4,1.4,1;4.8,1.4,1;5.0,1.7,1;4.5,1.5,1;3.5,1.0,1;3.8,1.1,1;3.7,1.0,1;3.9,1.2,1;5.1,1.6,1;4.5,1.5,1;4.5,1.6,1;4.7,1.5,1;4.4,1.3,1;4.1,1.3,1;4.0,1.3,1;4.4,1.2,1;4.6,1.4,1;4.0,1.2,1;3.3,1.0,1;4.2,1.3,1;4.2,1.2,1;4.2,1.3,1;4.3,1.3,1;3.0,1.1,1;4.1,1.3,1;6.0,2.5,2;5.1,1.9,2;5.9,2.1,2;5.6,1.8,2;5.8,2.2,2;6.6,2.1,2;4.5,1.7,2;6.3,1.8,2;5.8,1.8,2;6.1,2.5,2;5.1,2.0,2;5.3,1.9,2;5.5,2.1,2;5.0,2.0,2;5.1,2.4,2;5.3,2.3,2;5.5,1.8,2;6.7,2.2,2;6.9,2.3,2;5.0,1.5,2;5.7,2.3,2;4.9,2.0,2;6.7,2.0,2;4.9,1.8,2;5.7,2.1,2;6.0,1.8,2;4.8,1.8,2;4.9,1.8,2;5.6,2.1,2;5.8,1.6,2;6.1,1.9,2;6.4,2.0,2;5.6,2.2,2;5.1,1.5,2;5.6,1.4,2;6.1,2.3,2;5.6,2.4,2;5.5,1.8,2;4.8,1.8,2;5.4,2.1,2;5.6,2.4,2;5.1,2.3,2;5.1,1.9,2;5.9,2.3,2;5.7,2.5,2;5.2,2.3,2;5.0,1.9,2;5.2,2.0,2;5.4,2.3,2;5.1,1.8,2'
const F = CRUDO.split(';').map((s) => { const [l, a, e] = s.split(','); return { l: +l, a: +a, e: +e } })
const ESP = ['setosa', 'versicolor', 'virginica']
const COL = ['#0847c4', '#2e7d5b', '#f27900']
const TENUE = [[205, 218, 243], [203, 224, 214], [252, 222, 191]]   // los mismos colores, muy claros, para el fondo
const st = { l: 5.0, a: 1.6, k: 3, fondo: false }

// las k flores más cercanas, distancia de regla en cm; en empate de distancia gana la de menor índice (como scikit-learn)
function vecinas(l, a, k) {
  const top = []   // [dist2, i], ordenado
  for (let i = 0; i < F.length; i++) {
    const dl = F[i].l - l, da = F[i].a - a, d = dl * dl + da * da
    if (top.length < k || d < top[top.length - 1][0] - 1e-12) {
      let j = top.length; top.push(null)
      while (j > 0 && top[j - 1][0] > d + 1e-12) { top[j] = top[j - 1]; j-- }
      top[j] = [d, i]; if (top.length > k) top.pop()
    }
  }
  return top
}
// votos y ganadora; en empate de votos, la que va primero en la lista (setosa, versicolor, virginica), como scikit-learn
function votar(top) {
  const v = [0, 0, 0]; top.forEach(([, i]) => v[F[i].e]++)
  let g = 0; for (let e = 1; e < 3; e++) if (v[e] > v[g]) g = e
  return { v, g, empate: v.filter((x) => x === v[g]).length > 1 }
}

const X0 = 66, Y0 = 470, W = 670, H = 430, LMIN = 0.5, LMAX = 7.5, AMAX = 2.8
const px = (l) => X0 + (l - LMIN) / (LMAX - LMIN) * W, py = (a) => Y0 - a / AMAX * H
const lx = (x) => LMIN + (x - X0) / W * (LMAX - LMIN), ay = (y) => (Y0 - y) / H * AMAX

// flores repetidas: el mismo punto puede ser varias flores; se dibujan un poquito separadas para que se vean
const POS = (() => { const visto = {}; return F.map((f) => { const c = f.l + ',' + f.a, j = visto[c] = (visto[c] ?? -1) + 1
  const r = 3.6 * Math.sqrt(j), t = j * 2.4; return [px(f.l) + r * Math.cos(t), py(f.a) + r * Math.sin(t)] }) })()

let FONDO = { k: null, url: '' }
function fondo() {
  if (FONDO.k === st.k) return FONDO.url
  const nx = 224, ny = 144, cv = document.createElement('canvas'); cv.width = nx; cv.height = ny
  const cx = cv.getContext('2d'), img = cx.createImageData(nx, ny)
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const l = LMIN + (x + 0.5) / nx * (LMAX - LMIN), a = AMAX - (y + 0.5) / ny * AMAX
    const c = TENUE[votar(vecinas(l, a, st.k)).g], o = 4 * (y * nx + x)
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255
  }
  cx.putImageData(img, 0, 0); FONDO = { k: st.k, url: cv.toDataURL() }; return FONDO.url
}

function estrella(x, y, R) {
  const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? R * 0.45 : R, t = -Math.PI / 2 + i * Math.PI / 5; p.push(`${(x + r * Math.cos(t)).toFixed(1)},${(y + r * Math.sin(t)).toFixed(1)}`) }
  return `<polygon points="${p.join(' ')}" fill="#1a1a1a" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`
}

function pintar() {
  document.getElementById('tl').textContent = st.l.toFixed(1)
  document.getElementById('ta').textContent = st.a.toFixed(1)
  document.getElementById('tk').textContent = st.k
  document.getElementById('largo').value = st.l; document.getElementById('ancho').value = st.a; document.getElementById('k').value = st.k
  const top = vecinas(st.l, st.a, st.k), { v, g, empate } = votar(top)
  const lejos = Math.sqrt(top[top.length - 1][0])

  // tabla de votos
  document.getElementById('votos').innerHTML = '<tr><td class="nota">especie</td><td class="n nota">votos</td><td></td></tr>' + ESP.map((e, i) =>
    `<tr style="${i === g ? 'background:#fff3c4' : ''}"><td><span class="muestra" style="background:${COL[i]}"></span>${e}</td><td class="n">${v[i]}</td>` +
    `<td><div class="cuadros">${('<i style="background:' + COL[i] + '"></i>').repeat(v[i])}</div></td></tr>`).join('')
  const pr = document.getElementById('pred'); pr.textContent = ESP[g]; pr.style.color = COL[g]
  document.getElementById('empate').textContent = empate ? 'Hay empate: gana la que va primero en la lista.' : lejos === 0 ? `Las ${st.k} vecinas miden lo mismo que la flor nueva.` : `La más lejana que vota está a ${lejos.toFixed(2)} cm.`

  // gráfica
  let h = ''
  if (st.fondo) h += `<image href="${fondo()}" x="${X0}" y="${Y0 - H}" width="${W}" height="${H}" preserveAspectRatio="none" style="image-rendering: pixelated"/>`
  for (let a = 0; a <= 2.5; a += 0.5) h += `<line x1="${X0}" y1="${py(a)}" x2="${X0 + W}" y2="${py(a)}" stroke="#000" stroke-opacity="0.08"/><text x="${X0 - 8}" y="${py(a) + 4}" text-anchor="end" font-family="JetBrains Mono" font-size="13">${a.toFixed(1)}</text>`
  for (let l = 1; l <= 7; l++) h += `<line x1="${px(l)}" y1="${Y0 - H}" x2="${px(l)}" y2="${Y0}" stroke="#000" stroke-opacity="0.08"/><text x="${px(l)}" y="${Y0 + 20}" text-anchor="middle" font-family="JetBrains Mono" font-size="13">${l}</text>`
  h += `<rect x="${X0}" y="${Y0 - H}" width="${W}" height="${H}" fill="none" stroke="#1a1a1a" stroke-width="2"/>`
  h += `<text x="${X0 + W / 2}" y="${Y0 + 44}" text-anchor="middle" font-family="JetBrains Mono" font-size="14">largo del pétalo (cm)</text>`
  h += `<text x="14" y="${Y0 - H / 2}" text-anchor="middle" font-family="JetBrains Mono" font-size="14" transform="rotate(-90 14 ${Y0 - H / 2})">ancho del pétalo (cm)</text>`
  // leyenda
  ESP.forEach((e, i) => { const x = X0 + 14, y = Y0 - H + 22 + i * 22
    h += `<circle cx="${x}" cy="${y}" r="6.5" fill="${COL[i]}" stroke="#1a1a1a" stroke-width="1.2"/><text x="${x + 13}" y="${y + 5}" font-family="IBM Plex Sans" font-size="15" font-weight="600">${e}</text>` })
  const sx = px(st.l), sy = py(st.a)
  top.forEach(([, i]) => h += `<line x1="${sx}" y1="${sy}" x2="${POS[i][0].toFixed(1)}" y2="${POS[i][1].toFixed(1)}" stroke="#1a1a1a" stroke-width="1.8"/>`)
  F.forEach((f, i) => h += `<circle cx="${POS[i][0].toFixed(1)}" cy="${POS[i][1].toFixed(1)}" r="5.5" fill="${COL[f.e]}" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1"/>`)
  top.forEach(([, i]) => h += `<circle cx="${POS[i][0].toFixed(1)}" cy="${POS[i][1].toFixed(1)}" r="10" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>`)
  h += `<g id="flor" style="cursor: grab">${estrella(sx, sy, 13)}<circle cx="${sx}" cy="${sy}" r="18" fill="transparent"/></g>`
  h += `<text x="${X0 + W - 10}" y="${Y0 - 12}" text-anchor="end" font-family="IBM Plex Sans" font-size="14" fill="#575757">arrastra la estrella</text>`
  document.getElementById('g').innerHTML = h
}

// arrastrar la flor nueva (getScreenCTM respeta el zoom del iframe)
const svg = document.getElementById('g')
let arrastrando = false
function mover(ev) {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse())
  st.l = Math.min(7, Math.max(1, Math.round(lx(p.x) * 10) / 10))
  st.a = Math.min(2.6, Math.max(0.1, Math.round(ay(p.y) * 10) / 10))
  pintar()
}
svg.addEventListener('pointerdown', (ev) => { arrastrando = true; svg.setPointerCapture(ev.pointerId); mover(ev) })
svg.addEventListener('pointermove', (ev) => { if (arrastrando) mover(ev) })
svg.addEventListener('pointerup', () => { arrastrando = false })
svg.addEventListener('pointercancel', () => { arrastrando = false })

document.getElementById('largo').oninput = (e) => { st.l = +e.target.value; pintar() }
document.getElementById('ancho').oninput = (e) => { st.a = +e.target.value; pintar() }
document.getElementById('k').oninput = (e) => { st.k = +e.target.value; pintar() }
document.getElementById('fondo').onchange = (e) => { st.fondo = e.target.checked; pintar() }
document.getElementById('facil').onclick = () => { st.l = 4.0; st.a = 1.3; pintar() }
document.getElementById('dificil').onclick = () => { st.l = 5.0; st.a = 1.6; pintar() }

// ?k=15&fondo=1&l=5&a=1.6 para abrirlo ya preparado
const q = new URLSearchParams(location.search)
if (q.has('k')) st.k = Math.min(25, Math.max(1, +q.get('k') || 3))
if (q.has('l')) st.l = Math.min(7, Math.max(1, +q.get('l') || 5))
if (q.has('a')) st.a = Math.min(2.6, Math.max(0.1, +q.get('a') || 1.6))
if (q.get('fondo') === '1') { st.fondo = true; document.getElementById('fondo').checked = true }
pintar()
</script>
</body>
</html>
