<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El precio de las tortillas: escoger una regla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --papel: #fdfdfd; --papel2: #f2f2f2; --tinta: #1a1a1a; --tinta2: #575757;
  --error: #fb2c36; --amarillo: #ffcd42; --nota: #fff3c4;
  --borde: 2.5px solid var(--tinta); --sombra: 5px 5px 0 var(--tinta);
  --display: 'Oswald', 'Arial Narrow', sans-serif; --texto: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--papel); color: var(--tinta); font-family: var(--texto); }
.marco { height: 100vh; display: grid; grid-template-rows: 1fr auto; padding: 18px 22px 12px; gap: 12px; }
.escena { display: grid; grid-template-columns: 40fr 60fr; gap: 22px; min-height: 0; }
.izq { display: flex; flex-direction: column; min-height: 0; overflow: auto; padding-right: 4px; }
h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(1.4rem, 2.6vw, 2.3rem); line-height: 1.05;
  display: inline-block; align-self: flex-start; margin: 0 0 14px; padding: 6px 14px; border: var(--borde); box-shadow: var(--sombra); background: var(--papel); }
.item { margin: 0 0 12px; font-size: clamp(1rem, 1.55vw, 1.4rem); line-height: 1.45; }
.item.nuevo { animation: entra 250ms ease-out; }
.item p { margin: 0 0 4px; }
.formula { border: 1.25px solid var(--tinta); background: var(--papel); padding: 8px 12px; overflow-x: auto; }
.formula .katex { font-size: 1.2em; }
.palabras { background: var(--nota); border: 1.25px solid var(--tinta); padding: 6px 10px; margin-top: 6px; }
.frase { font-weight: 700; font-size: clamp(1.1rem, 1.8vw, 1.55rem); }
.opcional { border: 2px dashed var(--tinta2); padding: 6px 10px; }
.opcional .tit { font-family: var(--mono); font-size: 0.75em; font-weight: 700; text-transform: uppercase; color: var(--tinta2); }
mark { background: var(--amarillo); padding: 0 0.15em; }
.reglas { display: flex; flex-direction: column; gap: 6px; }
.regla { display: grid; grid-template-columns: 22px 2.6em 1fr; align-items: center; gap: 8px; border: 1.25px solid var(--tinta); padding: 4px 8px; cursor: pointer; background: var(--papel); font-size: 0.92em; }
.regla.apagada { opacity: 0.4; }
.regla.sel { box-shadow: 3px 3px 0 var(--tinta); border-width: 2.5px; }
.chip { width: 18px; height: 18px; border: 2px solid var(--tinta); }
.regla b { font-family: var(--mono); }
table.t { border-collapse: collapse; font-size: 0.92em; }
table.t th { background: var(--tinta); color: var(--papel); font-family: var(--mono); padding: 4px 10px; text-align: left; }
table.t td { border: 1.25px solid var(--tinta); padding: 4px 10px; font-family: var(--mono); }
table.t tr.clic { cursor: pointer; }
table.t tr.gana td { background: var(--amarillo); font-weight: 700; }
table.t tr.sel td:first-child { outline: 3px solid var(--tinta); outline-offset: -3px; }
table.texto td { font-family: var(--texto); }
.der { display: grid; grid-template-rows: 1.35fr 1fr; gap: 14px; min-height: 0; }
.der.una { grid-template-rows: 1fr; }
.der.una #p-barras { display: none; }
.panel { border: var(--borde); box-shadow: var(--sombra); background: var(--papel); position: relative; min-height: 0; }
.panel .etq { position: absolute; top: 8px; left: 10px; font-family: var(--mono); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; z-index: 1; }
.panel svg { width: 100%; height: 100%; display: block; }
.barra { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: var(--borde); padding-top: 10px; }
.barra .prog { font-family: var(--mono); font-weight: 700; }
button { font: 600 0.95rem var(--texto); padding: 7px 12px; border: var(--borde); background: var(--papel); color: var(--tinta); cursor: pointer; box-shadow: 3px 3px 0 var(--tinta); }
button:hover { background: var(--papel2); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
button:disabled { opacity: 0.35; cursor: default; }
.tortillas { width: 70%; max-width: 380px; margin: 10px auto; display: block; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 820px) {
  .marco { height: auto; }
  .escena { grid-template-columns: 1fr; }
  .der { grid-template-rows: 320px 240px; }
}
</style>
</head>
<body>
<div class="marco">
  <div class="escena">
    <section class="izq" id="izq" aria-live="polite"></section>
    <section class="der" id="der">
      <div class="panel"><span class="etq">Los tickets</span><svg id="g-tickets" viewBox="0 0 640 330" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="panel" id="p-barras"><span class="etq">Error promedio de cada regla, en pesos</span><svg id="g-barras" viewBox="0 0 640 250" preserveAspectRatio="xMidYMid meet"></svg></div>
    </section>
  </div>
  <div class="barra">
    <button id="ant">Anterior</button>
    <button id="sig">Siguiente</button>
    <span class="prog" id="prog"></span>
  </div>
</div>

<script>
// El precio de las tortillas, versión VI.1: inducir es escoger una regla de un menú.
// Sin cálculo: cada regla es una caja negra; solo importa cuánto se equivoca con lo visto y con lo nuevo.

const VISTOS = [[1, 25], [2, 51], [3, 74]]
const NUEVOS = [[4, 100], [5, 125]]
const REGLAS = [
  { id: 'h_1', color: '#0847c4', f: (x) => 25 * x, tex: '25x', dice: '25 pesos por kilo' },
  { id: 'h_2', color: '#f27900', f: (x) => 20 * x + 10, tex: '20x + 10', dice: '20 por kilo, más 10 de la bolsa' },
  { id: 'h_3', color: '#575380', f: (x) => 30 * x, tex: '30x', dice: '30 pesos por kilo' },
  { id: 'h_4', color: '#2e7d5b', f: (x) => 24 * x + 3, tex: '24x + 3', dice: '24 por kilo, más 3' },
  { id: 'h_5', color: '#b0007a', f: (x) => -1.5 * x * x + 30.5 * x - 4, tex: '-1.5x^2 + 30.5x - 4', dice: 'una curva que pasa exacto por los tres tickets' },
]
const err = (h, D) => D.reduce((s, [x, y]) => s + Math.abs(y - h.f(x)), 0) / D.length
const dentro = (h) => err(h, VISTOS)
const fuera = (h) => err(h, NUEVOS)
const mejorDentro = () => REGLAS.reduce((a, b) => (dentro(b) < dentro(a) ? b : a))
const f2 = (v) => v.toFixed(2)

const st = { paso: 1, clic: 0, vis: REGLAS.map(() => true), sel: null, ultimo: '' }

const tex = (s, display = true) => (window.katex ? katex.renderToString(s, { displayMode: display, throwOnError: false, strict: false }) : `<code>${s}</code>`)
const formula = (t, palabras) => `<div class="formula">${tex(t)}</div>${palabras ? `<div class="palabras">${palabras}</div>` : ''}`
const hTex = (h) => `\\textcolor{${h.color}}{${h.id}}`

const TORTILLAS = `<svg class="tortillas" viewBox="0 0 300 170" role="img" aria-label="Un kilo de tortillas envuelto en papel">
  <rect x="40" y="96" width="220" height="56" fill="#fff3c4" stroke="#1a1a1a" stroke-width="3"/>
  ${[0, 1, 2, 3, 4, 5].map((k) => `<ellipse cx="150" cy="${92 - k * 9}" rx="96" ry="22" fill="${k % 2 ? '#f6dd93' : '#f1cf73'}" stroke="#1a1a1a" stroke-width="3"/>`).join('')}
  <text x="150" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20">1 kg</text></svg>`

function listaReglas() {
  return `<div class="reglas">${REGLAS.map((h, i) => `<div class="regla ${st.vis[i] ? '' : 'apagada'} ${st.sel === i ? 'sel' : ''}" data-i="${i}">
    <span class="chip" style="background:${h.color}"></span><b>${tex(h.id, false)}</b><span>${tex(h.tex, false)} &nbsp; ${h.dice}</span></div>`).join('')}</div>`
}
function tablaErrores(conFuera) {
  const g = mejorDentro()
  return `<table class="t"><tr><th>regla</th><th>error con lo visto</th>${conFuera ? '<th>error con lo nuevo</th>' : ''}</tr>
    ${REGLAS.map((h, i) => `<tr class="clic ${h === g && st.paso >= 5 ? 'gana' : ''} ${st.sel === i ? 'sel' : ''}" data-i="${i}">
      <td>${tex(hTex(h), false)}</td><td>${f2(dentro(h))}</td>${conFuera ? `<td>${f2(fuera(h))}</td>` : ''}</tr>`).join('')}</table>`
}

// Cada paso: titulo, clics y vista. vista.barras: 'no' | 'dentro' | 'ambos'
const PASOS = [
  { titulo: 'El precio de las tortillas', vista: { barras: 'no' },
    clics: [() => `${TORTILLAS}<p class="frase">Un kilo de tortillas. ¿Cuánto cuesta?</p>`] },

  { titulo: 'Deducir: hay letrero', vista: { letrero: true, recta25: true, barras: 'no' },
    clics: [
      () => formula(`\\forall x,\\; y = 25x`, 'Se lee "para todo x": para cualquier cantidad de kilos, el precio es 25 por <i>x</i>.'),
      () => formula(`x = 3 \\;\\Rightarrow\\; y = 25 \\cdot 3 = 75`, 'Se lee "entonces": si llevas 3 kilos, pagas 75 pesos.'),
      () => `<p class="frase">Si el letrero dice la verdad, la conclusión es segura. Pero no aprendimos nada nuevo.</p>`,
    ] },

  { titulo: 'Inducir: solo hay tickets', vista: { puntosPorClic: true, barras: 'no' },
    clics: [
      () => `<p>Ahora no hay letrero. Solo tenemos tres tickets.</p>`,
      () => '', () => '',
      () => formula(`\\mathcal{D} = \\{(1,25),\\,(2,51),\\,(3,74)\\}`, 'Nuestros datos: tres compras, cada una con sus kilos y lo que se pagó. <i>m</i> = 3 ejemplos.'),
    ] },

  { titulo: 'Un menú de reglas', vista: { vistos: true, curvas: true, barras: 'no' },
    clics: [
      () => formula(`\\mathcal{H} = \\{${REGLAS.map(hTex).join(',\\,')}\\}`, 'Cinco reglas candidatas. Cada una es un modelo; no importa cómo se hizo, solo qué predice. Toca una para encenderla o apagarla.'),
      () => listaReglas(),
    ] },

  { titulo: 'Cuánto se equivoca cada regla', vista: { vistos: true, curvas: true, residuos: true, barras: 'dentro' },
    clics: [
      () => formula(`E_{\\text{dentro}}(h) = \\frac{1}{m}\\sum_{i=1}^{m} \\big|\\,\\hat y^{(i)} - y^{(i)}\\,\\big|`, 'Se lee: en promedio, ¿por cuántos pesos se equivoca la regla <i>h</i> con los tickets que vimos? Toca una fila para ver sus errores en rojo.'),
      () => tablaErrores(false),
    ] },

  { titulo: 'Escoger la regla', vista: { vistos: true, curvas: true, residuos: true, barras: 'dentro', ganadora: true },
    clics: [
      () => formula(`\\hat h = \\arg\\min_{h \\in \\mathcal{H}} E_{\\text{dentro}}(h) = ${hTex(mejorDentro())}`, 'Se lee: de todas las reglas del menú, la que menos se equivoca con lo visto. Eso es aprender de ejemplos.'),
      () => tablaErrores(false),
      () => `<p class="frase">Gana ${tex(hTex(mejorDentro()), false)}: no se equivoca ni un peso con los tickets que vio.</p>`,
    ] },

  { titulo: 'Llegan tickets nuevos', vista: { vistos: true, nuevos: true, curvas: true, residuosNuevos: true, barras: 'ambos', ganadora: true },
    clics: [
      () => formula(`E_{\\text{fuera}}(h) = \\frac{1}{2}\\big(\\,|h(4) - 100| + |h(5) - 125|\\,\\big)`, 'Dos clientes nuevos: 4 kilos por 100 pesos y 5 kilos por 125. ¿Por cuánto se equivoca cada regla con ellos?'),
      () => tablaErrores(true),
      () => `<p class="frase">La regla que mejor se ajusta a lo que vio no fue la que mejor predijo lo nuevo.</p>`,
    ] },

  { titulo: 'Qué supusimos', vista: { vistos: true, nuevos: true, curvas: true, barras: 'ambos' },
    clics: [
      () => `<p>${tex(hTex(REGLAS[4]), false)} reproduce exacto los tres tickets y aun así falló más que ${tex(hTex(REGLAS[0]), false)} con estos dos clientes nuevos. ${tex(hTex(REGLAS[0]), false)} solo los aproxima y acertó.</p>
        <p>Para 7 kilos, ${tex(hTex(REGLAS[0]), false)} cobra ${REGLAS[0].f(7)} pesos y ${tex(hTex(REGLAS[4]), false)} cobra ${REGLAS[4].f(7)}: con ${tex(hTex(REGLAS[4]), false)}, cada kilo extra sale más barato.</p>`,
      () => `<p>Los tickets no deciden entre las dos. Preferir ${tex(hTex(REGLAS[0]), false)} es suponer que el precio es aproximadamente proporcional a los kilos; preferir ${tex(hTex(REGLAS[4]), false)} es suponer un descuento por volumen. Ese supuesto es el <mark>sesgo inductivo</mark>.</p>`,
      () => `<p class="frase">Con dos clientes no queda demostrado cuál es mejor: es evidencia. Para confiar, se evalúa con muchos datos que la regla no usó.</p>`,
    ] },

  { titulo: 'Deducir e inducir, lado a lado', vista: { vistos: true, nuevos: true, curvas: true, soloSencilla: true, barras: 'no' },
    clics: [
      () => `<table class="t texto"><tr><th></th><th>Deducir</th><th>Inducir</th></tr>
        <tr><td>Parte de</td><td>El letrero</td><td>Los tickets</td></tr>
        <tr><td>Va de</td><td>La regla a los casos</td><td>Los casos a la regla</td></tr>
        <tr><td>Hay que medir el error</td><td>No</td><td>Sí</td></tr>
        <tr><td>Resultado</td><td>Seguro, si el letrero es cierto</td><td>Probable, y depende de lo que supones</td></tr></table>`,
      () => `<p class="frase">Todo modelo hace las dos cosas: induce la regla con los datos y luego la aplica deduciendo.</p>`,
    ] },
]

// ---------- gráficas ----------
const NS = 'http://www.w3.org/2000/svg'
const svgT = document.getElementById('g-tickets'), svgB = document.getElementById('g-barras')
const escala = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0)
const el = (tag, a, padre) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); padre.appendChild(e); return e }
const txt = (s, a, padre) => { const e = el('text', { 'font-family': 'JetBrains Mono, monospace', 'font-size': 12, ...a }, padre); e.textContent = s; return e }

function dibujarTickets(v) {
  svgT.replaceChildren()
  const H = v.barras === 'no' ? 560 : 330
  svgT.setAttribute('viewBox', `0 0 640 ${H}`)
  const M = { l: 56, r: 18, t: 46, b: 40 }
  const X = escala(0, 5.4, M.l, 640 - M.r - 30), Y = escala(0, 150, H - M.b, M.t)
  for (const k of [0, 1, 2, 3, 4, 5]) { el('line', { x1: X(k), y1: Y(0), x2: X(k), y2: Y(150), stroke: '#e4e4e4' }, svgT); txt(k, { x: X(k), y: Y(0) + 16, 'text-anchor': 'middle' }, svgT) }
  for (const k of [0, 25, 50, 75, 100, 125, 150]) { el('line', { x1: X(0), y1: Y(k), x2: X(5.4), y2: Y(k), stroke: '#e4e4e4' }, svgT); txt(k, { x: X(0) - 8, y: Y(k) + 4, 'text-anchor': 'end' }, svgT) }
  el('line', { x1: X(0), y1: Y(0), x2: X(5.4), y2: Y(0), stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgT)
  el('line', { x1: X(0), y1: Y(0), x2: X(0), y2: Y(150), stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgT)
  txt('kilos', { x: X(5.4), y: Y(0) + 32, 'text-anchor': 'end', 'font-weight': 700 }, svgT)
  txt('pesos', { x: X(0) + 6, y: Y(150) - 8, 'font-weight': 700 }, svgT)
  const clip = el('clipPath', { id: 'area' }, svgT); el('rect', { x: X(0), y: Y(150), width: X(5.4) - X(0), height: Y(0) - Y(150) }, clip)
  const g = el('g', { 'clip-path': 'url(#area)' }, svgT)

  if (v.letrero) {
    el('rect', { x: X(0.35), y: Y(140), width: 150, height: 40, fill: '#ffcd42', stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgT)
    txt('$25 el kilo', { x: X(0.35) + 75, y: Y(140) + 26, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700 }, svgT)
  }
  if (v.recta25) el('line', { x1: X(0), y1: Y(0), x2: X(5.4), y2: Y(135), stroke: '#1a1a1a', 'stroke-width': 3.5 }, g)

  if (v.curvas) {
    const xs = Array.from({ length: 109 }, (_, k) => k * 0.05)
    const etiquetas = []
    REGLAS.forEach((h, i) => {
      if (!st.vis[i]) return
      if (v.soloSencilla && i !== 0 && i !== 4) return
      const destacada = st.sel === null ? true : st.sel === i
      el('path', { d: xs.map((x, k) => `${k ? 'L' : 'M'}${X(x).toFixed(1)},${Y(h.f(x)).toFixed(1)}`).join(' '), fill: 'none', stroke: h.color,
        'stroke-width': destacada ? 3.5 : 1.5, 'stroke-opacity': destacada ? 1 : 0.35 }, g)
      etiquetas.push({ h, y: Y(Math.min(h.f(5.4), 150)) })
    })
    // etiquetas al final de cada curva, separadas para que no se encimen
    etiquetas.sort((a, b) => a.y - b.y)
    for (let k = 0; k < etiquetas.length; k++) {
      etiquetas[k].y = Math.max(etiquetas[k].y, Y(150) + 12, k ? etiquetas[k - 1].y + 16 : -Infinity)
      txt(etiquetas[k].h.id.replace('_', ''), { x: X(5.4) - 4, y: etiquetas[k].y + 4, 'text-anchor': 'end', fill: etiquetas[k].h.color, 'font-weight': 700, 'font-size': 14 }, svgT)
    }
  }
  const residuos = (D) => {
    if (st.sel === null) return
    const h = REGLAS[st.sel]
    for (const [x, y] of D) {
      el('line', { x1: X(x), y1: Y(y), x2: X(x), y2: Y(h.f(x)), stroke: '#fb2c36', 'stroke-width': 3 }, g)
      txt(f2(Math.abs(y - h.f(x))), { x: X(x) + 8, y: (Y(y) + Y(h.f(x))) / 2 + 4, fill: '#fb2c36', 'font-weight': 700 }, svgT)
    }
  }
  if (v.residuos) residuos(VISTOS)
  if (v.residuosNuevos) { residuos(VISTOS); residuos(NUEVOS) }

  let visibles = v.vistos ? 3 : 0
  if (v.puntosPorClic) visibles = Math.max(0, Math.min(3, st.clic))
  VISTOS.slice(0, visibles).forEach(([x, y], i) => {
    const p = el('circle', { cx: X(x), cy: Y(y), r: 7, fill: '#1a1a1a', stroke: '#fdfdfd', 'stroke-width': 2 }, svgT)
    if (v.puntosPorClic && i === visibles - 1) p.style.animation = 'entra 300ms ease-out'
  })
  if (v.nuevos) for (const [x, y] of NUEVOS) {
    el('rect', { x: X(x) - 7, y: Y(y) - 7, width: 14, height: 14, fill: '#fdfdfd', stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgT)
    txt('nuevo', { x: X(x) - 12, y: Y(y) - 12, 'text-anchor': 'end', 'font-weight': 700 }, svgT)
  }
}

function dibujarBarras(v) {
  svgB.replaceChildren()
  if (v.barras === 'no') return
  const M = { l: 56, r: 18, t: 40, b: 34 }
  const top = 25
  const X = (i) => M.l + 20 + i * ((640 - M.l - M.r - 20) / REGLAS.length)
  const ancho = (640 - M.l - M.r - 20) / REGLAS.length
  const Y = escala(0, top, 250 - M.b, M.t)
  for (const k of [0, 5, 10, 15, 20, 25]) { el('line', { x1: M.l, y1: Y(k), x2: 640 - M.r, y2: Y(k), stroke: '#e4e4e4' }, svgB); txt(k, { x: M.l - 8, y: Y(k) + 4, 'text-anchor': 'end' }, svgB) }
  el('line', { x1: M.l, y1: Y(0), x2: 640 - M.r, y2: Y(0), stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgB)
  el('line', { x1: M.l, y1: Y(0), x2: M.l, y2: Y(top), stroke: '#1a1a1a', 'stroke-width': 2.5 }, svgB)
  const ambos = v.barras === 'ambos'
  const bw = ambos ? ancho * 0.32 : ancho * 0.5
  REGLAS.forEach((h, i) => {
    const x0 = X(i) + (ambos ? ancho * 0.14 : ancho * 0.22)
    const d = dentro(h)
    el('rect', { x: x0, y: Y(d), width: bw, height: Math.max(1, Y(0) - Y(d)), fill: h.color, stroke: '#1a1a1a', 'stroke-width': 2 }, svgB)
    txt(f2(d), { x: x0 + bw / 2, y: Y(d) - 6, 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 11 }, svgB)
    if (ambos) {
      const fz = fuera(h), x1 = x0 + bw + 4
      el('rect', { x: x1, y: Y(fz), width: bw, height: Math.max(1, Y(0) - Y(fz)), fill: '#fdfdfd', stroke: h.color, 'stroke-width': 3 }, svgB)
      txt(f2(fz), { x: x1 + bw / 2, y: Y(fz) - 6, 'text-anchor': 'middle', 'font-weight': 700, 'font-size': 11 }, svgB)
    }
    txt(h.id.replace('_', ''), { x: X(i) + ancho / 2, y: Y(0) + 18, 'text-anchor': 'middle', 'font-weight': 700, fill: h.color }, svgB)
  })
  // leyenda
  el('rect', { x: 640 - M.r - 250, y: 12, width: 14, height: 14, fill: '#575757', stroke: '#1a1a1a' }, svgB)
  txt('con lo visto', { x: 640 - M.r - 230, y: 24 }, svgB)
  if (ambos) {
    el('rect', { x: 640 - M.r - 130, y: 12, width: 14, height: 14, fill: '#fdfdfd', stroke: '#575757', 'stroke-width': 2.5 }, svgB)
    txt('con lo nuevo', { x: 640 - M.r - 110, y: 24 }, svgB)
  }
}

// ---------- render y navegación ----------
const izq = document.getElementById('izq')
function pintar() {
  const p = PASOS[st.paso - 1], v = p.vista
  const clave = `${st.paso}.${st.clic}`, nuevo = clave !== st.ultimo
  st.ultimo = clave
  izq.innerHTML = `<h1>${p.titulo}</h1>` + p.clics.slice(0, st.clic + 1).map((f, i) => `<div class="item${nuevo && i === st.clic ? ' nuevo' : ''}">${f()}</div>`).join('')
  document.getElementById('der').classList.toggle('una', v.barras === 'no')
  dibujarTickets(v)
  dibujarBarras(v)
  document.getElementById('prog').textContent = `${st.paso} de ${PASOS.length}`
  document.getElementById('ant').disabled = st.paso === 1 && st.clic === 0
  document.getElementById('sig').disabled = st.paso === PASOS.length && st.clic === p.clics.length - 1
  izq.querySelectorAll('.regla').forEach((r) => (r.onclick = () => { const i = +r.dataset.i; st.vis[i] = !st.vis[i]; pintar() }))
  izq.querySelectorAll('tr.clic').forEach((r) => (r.onclick = () => { const i = +r.dataset.i; st.sel = st.sel === i ? null : i; pintar() }))
  const u = new URL(location); u.searchParams.set('paso', st.paso); history.replaceState(null, '', u)
}
function entrarPaso(k, clic = 0) {
  st.paso = Math.max(1, Math.min(PASOS.length, k)); st.clic = clic
  const v = PASOS[st.paso - 1].vista
  st.vis = REGLAS.map(() => true)
  st.sel = v.ganadora ? REGLAS.indexOf(mejorDentro()) : null
  pintar()
}
function siguiente() { const p = PASOS[st.paso - 1]; if (st.clic < p.clics.length - 1) { st.clic++; pintar() } else if (st.paso < PASOS.length) entrarPaso(st.paso + 1) }
function anterior() { if (st.clic > 0) { st.clic--; pintar() } else if (st.paso > 1) entrarPaso(st.paso - 1, PASOS[st.paso - 2].clics.length - 1) }
document.getElementById('sig').onclick = siguiente
document.getElementById('ant').onclick = anterior
document.addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); siguiente() }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); anterior() }
})
window.addEventListener('load', () => {
  entrarPaso(Number(new URLSearchParams(location.search).get('paso')) || 1)
  console.log('[induccion]', REGLAS.map((h) => `${h.id}: dentro ${f2(dentro(h))}, fuera ${f2(fuera(h))}`).join(' | '))
})
</script>
